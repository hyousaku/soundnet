# /etc/security/limits.d/99-realtime.conf
# Grant the `audio` group the ability to run threads at real-time priority
# and to lock memory. Required for consistent low-latency audio on Linux.
# After installing this file, log out and back in for the limits to apply.

@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice       -19
