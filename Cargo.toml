[workspace]
resolver = "2"
members = [
    "crates/soundnet-engine",
    "crates/soundnet-protocol",
    "crates/roc-sys",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/hyousaku/soundnet"

[workspace.dependencies]
soundnet-protocol = { path = "crates/soundnet-protocol" }
roc-sys = { path = "crates/roc-sys" }

anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
